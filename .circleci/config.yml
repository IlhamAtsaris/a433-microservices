version: 2.1

jobs:
  lint-dockerfile:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            curl -sSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x /tmp/hadolint
      - run:
          name: Lint Dockerfile
          command: /tmp/hadolint Dockerfile

  test-app:
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Run Go tests
          command: |
            go mod download
            go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Docker login
          command: |     # tambahkan env variables di CircleCI
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/karsajobs:$CIRCLE_SHA1 .
      - run:
          name: Push Docker Image
          command: |
            docker push $DOCKERHUB_USERNAME/karsajobs:$CIRCLE_SHA1

workflows:
  version: 2
  ci-backend:
    jobs:
      - lint-dockerfile:
          filters:
            branches:
              only: karsajobs
      - test-app:
          requires:
            - lint-dockerfile
          filters:
            branches:
              only: karsajobs
      - build-app-karsajobs:
          requires:
            - test-app
          filters:
            branches:
              only: karsajobs
