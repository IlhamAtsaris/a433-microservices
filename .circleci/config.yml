version: 2.1

jobs:                           # Daftar semua job yang akan dijalankan dalam pipeline
  lint-dockerfile:
    docker:                     # Job pertama: melakukan pengecekan kualitas Dockerfile
      - image: cimg/base:stable
    steps:
      - checkout
      - run:                       # Step untuk menginstal hadolint (Dockerfile linter)
          name: Install hadolint
          command: |
            curl -sSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x /tmp/hadolint
      - run:                      # Step untuk menjalankan hadolint pada Dockerfile project
          name: Lint Dockerfile
          command: /tmp/hadolint Dockerfile

  test-app:                   # Job kedua: menjalankan unit test Go untuk backend
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Run Go tests
          command: |
            go mod download
            go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:        # Job ketiga: build & push Docker image backend ke DockerHub
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker     # Mengaktifkan lingkungan Docker di CircleCI agar bisa build image
      - run:                    # Step login DockerHub untuk autentikasi push image
          name: Docker login
          command: |     # tambahkan env variables di CircleCI
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:      
          name: Build Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/karsajobs:$CIRCLE_SHA1 .
      - run:
          name: Push Docker Image
          command: |
            docker push $DOCKERHUB_USERNAME/karsajobs:$CIRCLE_SHA1

workflows:            # Mendefinisikan workflow, urutan job, dan filtering branch
  version: 2
  ci-backend:
    jobs:
      - lint-dockerfile:
          filters:
            branches:
              only: karsajobs      # Workflow hanya berjalan saat ada push ke branch `karsajobs`
      - test-app:
          requires:                 # Job kedua dijalankan setelah lint Dockerfile sukses
            - lint-dockerfile
          filters:
            branches:
              only: karsajobs
      - build-app-karsajobs:        # Job terakhir: build dan push Docker image
          requires:
            - test-app
          filters:
            branches:
              only: karsajobs
