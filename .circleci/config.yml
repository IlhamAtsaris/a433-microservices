version: 2.1

jobs:
  lint-dockerfile:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            curl -sSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-linux-x86_64
            chmod +x /usr/local/bin/hadolint
      - run:
          name: Lint Dockerfile
          command: hadolint Dockerfile

  test-app:
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Run Go tests
          command: |
            go mod download
            go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Docker login
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build Docker image
          command: |
            docker build -t $DOCKERHUB_USERNAME/karsajobs:$CIRCLE_SHA1 .
      - run:
          name: Push Docker image
          command: |
            docker push $DOCKERHUB_USERNAME/karsajobs:$CIRCLE_SHA1

workflows:
  version: 2
  ci-backend:
    jobs:
      - lint-dockerfile:
